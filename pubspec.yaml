name: animooo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

#==================================  Dev  Dependencies  Section  ==============================
dependencies:
  flutter:
    sdk: flutter

  #! ============  app dependencies  ============
  # Icons for iOS style design
  cupertino_icons: ^1.0.8
  # SVG rendering and display support
  flutter_svg: ^2.0.9
  # Local storage for simple key-value pairs
  shared_preferences: ^2.3.5
  # Persistent bottom navigation bar for Flutter
  persistent_bottom_nav_bar: ^6.2.1
  # Email validation utility
  email_validator: ^3.0.0

#==================================  Dev  Dependencies  Section  ==============================
dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

#==================================  Flutter  Section Add Images and Fonts ====================
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/svgs/
    - assets/icons/

  # To add assets to your application, add an assets section, like this:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
          weight: 400
        - asset: assets/fonts/poppins_medium.ttf
          weight: 500
        - asset: assets/fonts/poppins_semibold.ttf
          weight: 600
        - asset: assets/fonts/poppins_bold.ttf
          weight: 700

#!#==================================  Flutter launcher icons#==================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 21
