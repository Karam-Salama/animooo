name: animooo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

#==================================  Dev  Dependencies  Section  ==============================
dependencies:
  flutter:
    sdk: flutter

  #! ============  app dependencies  ============
  # Icons for iOS style design
  cupertino_icons: ^1.0.8
  # SVG rendering and display support
  flutter_svg: ^2.0.9

#==================================  Dev  Dependencies  Section  ==============================
dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

#==================================  Flutter  Section Add Images and Fonts ====================
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/svgs/
    - assets/icons/

  # To add assets to your application, add an assets section, like this:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

#!#==================================  Flutter launcher icons#==================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 21
